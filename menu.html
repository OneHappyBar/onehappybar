<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>One Happy Bar Menu</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#04122d;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
}

/* Loading Screen */

.loader{
  position:fixed;
  inset:0;
  background:#04122d;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:22px;
  z-index:999;
  transition:.4s;
}

.loader.hide{
  opacity:0;
  visibility:hidden;
}

/* Menu Pages */

.page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  scroll-snap-align:start;
  background:#04122d;
}

.page img{
  width:100%;
  max-width:720px;
  height:auto;
  display:block;
}

/* Back To Top */

#topBtn{

  position:fixed;

  bottom:22px;
  right:18px;

  width:54px;
  height:54px;

  border:none;
  border-radius:50%;

  background:#ffb400;
  color:#04122d;

  font-size:24px;
  font-weight:bold;

  cursor:pointer;

  display:none;

  box-shadow:0 8px 20px rgba(0,0,0,.35);

  transition:.25s;
}

#topBtn:hover{

  transform:translateY(-2px);

  background:#ffc533;
}

</style>
</head>

<body>

<div id="loader" class="loader">
🍹 Loading Menu...
</div>

<section class="page">
<img src="page1.png" alt="Hot Panini's">
</section>

<section class="page">
<img src="page2.png" alt="Beer Selection">
</section>

<section class="page">
<img src="page3.png" alt="Wine Selection">
</section>

<section class="page">
<img src="page4.png" alt="Our Cocktails">
</section>

<section class="page">
<img src="page5.png" alt="Martini's and More">
</section>

<section class="page">
<img src="page6.png" alt="Non Alcoholic and More">
</section>

<button id="topBtn">↑</button>

<script>

window.addEventListener("load",function(){

document.getElementById("loader").classList.add("hide");

});

const topBtn=document.getElementById("topBtn");

window.addEventListener("scroll",function(){

topBtn.style.display=window.scrollY>600?"block":"none";

});

topBtn.addEventListener("click",function(){

window.scrollTo({
top:0,
behavior:"smooth"
});

});

</script>

</body>
</html>
