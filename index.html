<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="One Happy Bar — Aruba. Welcome & house policies." />
  <meta name="theme-color" content="#0a4d68" />
  <title>One Happy Bar | Welcome</title>
  <link rel="preconnect" href="[fonts.googleapis.com](https://fonts.googleapis.com)" />
  <link rel="preconnect" href="[fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin />
  <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap)" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-overlay" aria-hidden="true"></div>

  <main class="page">
    <section class="glass-card" role="dialog" aria-labelledby="welcome-title" aria-describedby="policies-list">
      <header class="brand">
        <div class="logo-wrap">
          <!-- One Happy Bar mark: sun + wave monogram -->
          <svg class="logo-mark" viewBox="0 0 80 80" xmlns="[w3.org](http://www.w3.org/2000/svg)" aria-hidden="true">
            <defs>
              <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFE566" />
                <stop offset="100%" stop-color="#FF9F43" />
              </linearGradient>
              <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#5CE1E6" />
                <stop offset="100%" stop-color="#0077B6" />
              </linearGradient>
            </defs>
            <circle cx="40" cy="32" r="16" fill="url(#sunGrad)" />
            <circle cx="40" cy="32" r="10" fill="#FFF3BF" opacity="0.85" />
            <path d="M8 52c8-8 16-8 24 0s16 8 24 0 16-8 24 0v12H8V52z" fill="url(#waveGrad)" opacity="0.95" />
            <path d="M8 60c8-6 16-6 24 0s16 6 24 0 16-6 24 0v8H8v-8z" fill="#48CAE4" opacity="0.7" />
          </svg>
          <div class="logo-text">
            <p class="logo-eyebrow">Aruba</p>
            <h1 id="welcome-title" class="logo-name">One Happy Bar</h1>
          </div>
        </div>
        <p class="tagline">One Happy Island vibes · Cold drinks · Good times</p>
      </header>

      <div class="divider" aria-hidden="true"></div>

      <div class="welcome-body">
        <h2 class="section-title">Welcome</h2>
        <p class="intro">Please review our house policies before continuing to the menu.</p>

        <ul id="policies-list" class="policies">
          <li class="policy">
            <span class="policy-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <path d="M4.93 4.93l14.14 14.14" />
              </svg>
            </span>
            <span><strong>No outside food or beverages.</strong></span>
          </li>
          <li class="policy">
            <span class="policy-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
              </svg>
            </span>
            <span><strong>Seating is reserved for One Happy Bar patrons.</strong></span>
          </li>
          <li class="policy">
            <span class="policy-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="1" x2="12" y2="23" />
                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
              </svg>
            </span>
            <span><strong>Minimum purchase of $35 per person.</strong></span>
          </li>
        </ul>

        <label class="checkbox-row" for="policy-check">
          <input type="checkbox" id="policy-check" name="policy-check" />
          <span class="custom-check" aria-hidden="true"></span>
          <span class="checkbox-label">I have read and understand these policies</span>
        </label>

        <button type="button" id="continue-btn" class="btn-continue" disabled>
          <span>Continue to Menu</span>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14" />
            <path d="M12 5l7 7-7 7" />
          </svg>
        </button>
      </div>

      <footer class="card-footer">
        <p>One Happy Bar · Aruba</p>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
